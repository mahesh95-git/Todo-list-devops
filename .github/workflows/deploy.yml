name: Deploy Todo App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: maheshrathodacr01.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        run: |
          docker build -t maheshrathodacr01.azurecr.io/todo-backend:${{ github.sha }} ./todo-backend
          docker push maheshrathodacr01.azurecr.io/todo-backend:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build -t maheshrathodacr01.azurecr.io/todo-client:${{ github.sha }} ./todo-client
          docker push maheshrathodacr01.azurecr.io/todo-client:${{ github.sha }}
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
            host: ${{ secrets.AZURE_VM_HOST }}
            username: ${{ secrets.AZURE_VM_USERNAME }}
            key: ${{ secrets.AZURE_VM_SSH_KEY }}
            script: |
               cd ~/Todo-list-devops
                docker-compose down
                
                export IMAGE_TAG=${{ github.sha }}

                docker-compose pull
                docker-compose up -d
