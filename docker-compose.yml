services:
  client:
    build:
       context: ./todo-client
    container_name: todo-client
    ports:
        - "8080:80"
    depends_on:
        - backend
  backend:
    build:
      context: ./todo-backend
    container_name: todo-backend
    ports:
        - "5000:5000"
    env_file:
        - ./todo-backend/.env
